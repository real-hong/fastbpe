name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy --strict src

  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # pyproject: requires-python = ">=3.12". "3.14t" is the free-threaded build
        # (uv's short-variant syntax), so the thread tests in tests/test_cache.py run
        # without the GIL; test_free_threaded_build_runs_without_the_gil checks that.
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    env:
      HYPOTHESIS_PROFILE: ci
      # Fail instead of skipping the tiktoken oracle tests when its data is missing.
      FASTBPE_REQUIRE_ORACLE: "1"
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Only tiktoken's downloaded gpt2 ranks; uv's cache is setup-uv's own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tiktoken-cache
          key: tiktoken-gpt2
      - run: uv run pytest --runslow
