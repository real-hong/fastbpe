[project]
name = "fastbpe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "real-hong", email = "xiulieshan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fastbpe = "fastbpe:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    # pytest-benchmark 5.3.0 reads node._nodeid, which pytest 9.2 removed.
    "pytest>=9.1,<9.2",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "regex>=2026.9.29",
    "ruff>=0.17.3",
    "tiktoken>=0.14.0",
    "types-regex>=2026.9.29.20261017",
]

[tool.ruff]
line-length = 100
# Review evidence kept verbatim (see scripts/review/README.md).
extend-exclude = ["scripts/review"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PERF", "RUF", "N", "ANN"]
# Full-width CJK punctuation is legitimate tokenizer test data.
allowed-confusables = ["，", "！", "："]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
testpaths = ["tests"]
# tests/naive_bpe.py is the reference trainer for tests and benchmarks.
pythonpath = ["tests"]
xfail_strict = true
markers = [
    "oracle: compares against tiktoken's gpt2 encoding (first run downloads its data)",
    "slow: long-running edge-case tests",
]

[tool.coverage.run]
branch = true
source = ["fastbpe"]
